<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
  <script>
    // Set the theme before the first paint, so dark mode does not flash white.
    document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  </script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" title="Reload">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 6h9M6.3 8.2l4.4 7.6M17.7 8.2l-4.4 7.6"/></svg>
      Topology
    </a>
    <div class="run-status" aria-live="polite">
      <span class="dot-state" id="state-dot"></span>
      <span id="state-label">Connecting to backend</span>
      <span id="run-detail" class="run-detail">
        <strong id="bar-time"></strong>
        <span id="bar-ago"></span>
        <span class="sep"></span>
        <span id="bar-next"></span>
        <span id="bar-status" class="run-changes" hidden>
          <span class="sep"></span>
          Status: <strong id="bar-changes"></strong>
        </span>
      </span>
    </div>
    <div class="bar-actions">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" placeholder="Find a device by IP address or hostname" autocomplete="off" aria-label="Find a device by IP address or hostname" role="combobox" aria-expanded="false" aria-controls="search-results">
        <button type="button" id="search-clear" class="search-clear" aria-label="Clear search" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <ul class="search-results" id="search-results" role="listbox" hidden></ul>
      </label>
      <select id="layout" class="btn" aria-label="Layout">
        <option value="layered">Layered</option>
        <option value="organic">Organic</option>
        <option value="concentric">Concentric</option>
        <option value="circle">Circle</option>
      </select>
      <button id="btn-inventory" class="btn" data-tip="Devices to poll and how to reach them">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></svg>
        Devices
      </button>
      <button id="btn-ports" class="btn" aria-pressed="true" data-tip="Show interface names on every link">Ports</button>
      <button id="btn-theme" class="btn icon" aria-label="Toggle dark mode" data-tip="Light or dark mode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button id="btn-run" class="btn run" data-tip="Start a run now">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
        Run discovery
      </button>
    </div>
  </header>

  <main id="main">
    <section class="stage" id="stage">
      <div id="cy" aria-label="Network topology"></div>
      <div class="stats" id="stats"></div>
      <div class="canvas-empty" id="canvas-empty" hidden>No devices</div>
      <button class="btn panel-open" id="panel-open" aria-label="Show side panel" data-tip="Show panel (P)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16M10 10l-2 2 2 2"/></svg>
        Events and details
      </button>
      <div class="controls">
        <button id="zoom-in" aria-label="Zoom in" data-tip="Zoom in"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="zoom-out" aria-label="Zoom out" data-tip="Zoom out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <button id="fit" aria-label="Fit to screen" data-tip="Fit to screen (F)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button id="export" aria-label="Download topology as PNG" data-tip="Download topology as PNG"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
      </div>
      <canvas id="minimap" aria-label="Minimap, drag to move the view"></canvas>
      <div class="legend" id="legend" role="toolbar" aria-label="Show only one kind">
        <button type="button" data-filter="router" aria-pressed="false" title="Show only routers"><i class="sw router"></i>Router</button>
        <button type="button" data-filter="switch" aria-pressed="false" title="Show only switches"><i class="sw switch"></i>Switch</button>
        <button type="button" data-filter="unregistered" aria-pressed="false" title="Show only devices seen as LLDP neighbors, not in Devices"><i class="sw unregistered"></i>Unregistered</button>
        <button type="button" data-filter="onesided" aria-pressed="false" title="Show only links reported by one end"><i class="sw onesided"></i>One-sided</button>
        <button type="button" data-filter="down" aria-pressed="false" title="Show only links that are down"><i class="sw down"></i>Link down</button>
      </div>
      <div class="toast" id="toast" role="status" hidden></div>
    </section>

    <aside>
      <div class="panel-head">
        <div class="tabs" role="tablist">
          <button role="tab" id="tab-events" aria-selected="true" aria-controls="pane-events">Events <span class="badge" id="badge" hidden>0</span></button>
          <button role="tab" id="tab-details" aria-selected="false" aria-controls="pane-details">Details</button>
        </div>
        <button class="btn icon panel-close" id="panel-close" aria-label="Hide side panel" data-tip="Hide panel (P)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16M8 10l2 2-2 2"/></svg>
        </button>
      </div>
      <div class="pane" id="pane-events" role="tabpanel">
        <label class="search events-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="events-search" placeholder="Search events" autocomplete="off" aria-label="Search events">
          <button type="button" id="events-search-clear" class="search-clear" aria-label="Clear event search" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </label>
        <div id="events-list"></div>
      </div>
      <div class="pane" id="pane-details" role="tabpanel" hidden></div>
    </aside>
  </main>

  <section id="inventory" class="inventory" aria-label="Inventory" hidden></section>
  <dialog id="inv-dialog" class="dialog"></dialog>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
