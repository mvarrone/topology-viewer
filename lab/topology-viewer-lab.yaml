lab:
  title: Topology Viewer lab
  version: 0.3.1
  description: Three IOS XE routers with RESTCONF (C8000V 17.18, CSR 1000V 17.3) and three LLDP only IOL nodes (R4, SW1, SW2) that show up as unregistered neighbors.
  notes: 'Credentials: admin / cisco. OOB management 10.10.20.0/24 through OOB-SW and the System Bridge external connector. See docs/cml-lab.md in the repo.'
nodes:
- id: n0
  label: R1
  node_definition: cat8000v
  x: 0
  y: -180
  tags: []
  ram: 4096
  configuration:
  - name: iosxe_config.txt
    content: |
      platform console serial
      !
      hostname R1
      ip domain name lab.local
      !
      username admin privilege 15 secret cisco
      aaa new-model
      aaa authentication login default local
      aaa authorization exec default local
      !
      vrf definition MGMT
       address-family ipv4
       exit-address-family
      !
      interface GigabitEthernet1
       description OOB management
       vrf forwarding MGMT
       ip address 10.10.20.11 255.255.255.0
       no lldp transmit
       no lldp receive
       no shutdown
      !
      interface GigabitEthernet2
       description to R2 Gi2
       no ip address
       no shutdown
      !
      interface GigabitEthernet3
       description to R3 Gi2
       no ip address
       no shutdown
      !
      interface GigabitEthernet4
       description to R4 Et0/0
       no ip address
       no shutdown
      !
      ip http secure-server
      ip http authentication local
      restconf
      !
      lldp run
      !
      ip ssh version 2
      crypto key generate rsa modulus 2048
      line vty 0 4
       transport input ssh
      !
      end
  pyats:
    username: admin
    password: cisco
    enable_password: cisco
  interfaces:
  - id: i0
    label: Loopback0
    type: loopback
  - id: i1
    label: GigabitEthernet1
    type: physical
    slot: 0
  - id: i2
    label: GigabitEthernet2
    type: physical
    slot: 1
  - id: i3
    label: GigabitEthernet3
    type: physical
    slot: 2
  - id: i4
    label: GigabitEthernet4
    type: physical
    slot: 3
- id: n1
