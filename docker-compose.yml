# Topology Viewer: docker compose up -d --build, then open http://localhost:5173
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_FILE: data/topology.db
      POSITIONS_FILE: data/positions.json
    volumes:
      - topology-data:/app/data
    ports:
      # API and its docs (http://localhost:8000/docs). Remove this to keep the API internal.
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:8080"

volumes:
  topology-data:
